# Render Blueprint Specification for Vortexen + Plus UAE RevenueOS
# Deploys Backend FastAPI API, PostgreSQL Database, and Next.js Frontend

services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: revenue-os-backend
    env: python
    region: frankfurt # or singapore / oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: revenue-os-db
          property: connectionString
      - key: DEFAULT_LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZOHO_CRM_CLIENT_ID
        sync: false
      - key: ZOHO_CRM_CLIENT_SECRET
        sync: false
      - key: ZOHO_CRM_REFRESH_TOKEN
        sync: false
      - key: VAPI_API_KEY
        sync: false

  # 2. Next.js Frontend Command Center
  - type: web
    name: revenue-os-frontend
    env: node
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: revenue-os-backend
          property: url

# 3. PostgreSQL Database Instance
databases:
  - name: revenue-os-db
    databaseName: revenue_os
    user: revenue_os_user
    region: frankfurt
